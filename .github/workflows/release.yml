name: Release

on:
  push:
    branches: ['release/**']

jobs:
  publish:
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Publish AOT
        run: dotnet publish ActivityGearSync/ActivityGearSync.csproj -c Release -r ${{ matrix.rid }}

      - name: Get version from build output
        id: version
        shell: bash
        run: |
          VERSION=$(cat ActivityGearSync/bin/Release/net10.0/${{ matrix.rid }}/publish/version.json | jq -r '.Version')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ActivityGearSync-${{ matrix.rid }}-${{ steps.version.outputs.version }}
          path: |
            ActivityGearSync/bin/Release/net10.0/${{ matrix.rid }}/publish/ActivityGearSync
            ActivityGearSync/bin/Release/net10.0/${{ matrix.rid }}/publish/ActivityGearSync.exe
            ActivityGearSync/bin/Release/net10.0/${{ matrix.rid }}/publish/version.json
          if-no-files-found: error

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Get version from artifact
        id: version
        run: |
          VERSION=$(jq -r '.Version' "$(ls artifacts/*/version.json | head -1)")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Prepare release files
        run: |
          mkdir release-files
          for dir in artifacts/*/; do
            name=$(basename "$dir")
            if [ -f "$dir/ActivityGearSync.exe" ]; then
              cp "$dir/ActivityGearSync.exe" "release-files/${name}.exe"
            elif [ -f "$dir/ActivityGearSync" ]; then
              cp "$dir/ActivityGearSync" "release-files/${name}"
            fi
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          files: release-files/*
          generate_release_notes: true
