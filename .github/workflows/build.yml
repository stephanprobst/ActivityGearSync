name: Build

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore ActivityGearSync/ActivityGearSync.csproj

      - name: Build
        run: dotnet build ActivityGearSync/ActivityGearSync.csproj --configuration Release --no-restore

  publish:
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Get version
        uses: dotnet/nbgv@master
        id: nbgv

      - name: Publish AOT
        run: dotnet publish ActivityGearSync/ActivityGearSync.csproj -c Release -r ${{ matrix.rid }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ActivityGearSync-${{ matrix.rid }}-${{ steps.nbgv.outputs.SemVer2 }}
          path: ActivityGearSync/bin/Release/net10.0/${{ matrix.rid }}/publish/
          if-no-files-found: error
